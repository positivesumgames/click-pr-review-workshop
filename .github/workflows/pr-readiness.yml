name: Publish PR readiness
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Workshop Tests]
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number in this teaching repository
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: workshop-readiness-${{ github.repository }}
  cancel-in-progress: false
jobs:
  readiness:
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
      && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted main only; never PR code or artifacts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Evaluate metadata and publish the current-head commit status
        working-directory: workshop
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSHOP_EVIDENCE_PUBLISHER: ${{ vars.WORKSHOP_EVIDENCE_PUBLISHER }}
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pr_review_workshop action
