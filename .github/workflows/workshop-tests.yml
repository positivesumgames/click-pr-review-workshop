name: Workshop Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test PR code without secrets or write privileges
        working-directory: workshop
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/workshop/.work/pip
          TMPDIR: ${{ github.workspace }}/workshop/.work/tmp
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p .work/tmp .work/pip
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
          .venv/bin/python -m pytest -q
          .venv/bin/python -m ruff check .
          .venv/bin/python scripts/validate_workshop.py
          .venv/bin/python scripts/check_pr_case.py
