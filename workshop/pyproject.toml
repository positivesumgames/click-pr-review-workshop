[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-workshop"
version = "0.1.0"
description = "A small, fail-closed prepare-PR loop and developer workshop"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3", "PyYAML==6.0.3"]

[project.scripts]
workshop-pr = "pr_review_workshop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.work/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".work", ".intent", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
